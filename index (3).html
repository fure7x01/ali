<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health & Traditional Medicine - Theatre Presentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        @keyframes grain {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -10%); }
            20% { transform: translate(-15%, 5%); }
            30% { transform: translate(7%, -25%); }
            40% { transform: translate(-5%, 25%); }
            50% { transform: translate(-15%, 10%); }
            60% { transform: translate(15%, 0%); }
            70% { transform: translate(0%, 15%); }
            80% { transform: translate(3%, 35%); }
            90% { transform: translate(-10%, 10%); }
        }
        
        .grain-effect {
            animation: grain 8s steps(10) infinite;
        }
        
        .fade-transition {
            transition: all 0.7s ease;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="https://files.catbox.moe/5ef5b6.mp3" type="audio/mpeg">
    </audio>

    <div id="app" class="w-full h-screen cursor-pointer relative" onclick="handleClick(event)">
        <!-- Film grain effect -->
        <div class="absolute inset-0 opacity-5 pointer-events-none grain-effect" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=\'0 0 400 400\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.9\' numOctaves=\'4\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E');"></div>
        
        <!-- Vignette effect -->
        <div class="absolute inset-0 pointer-events-none" style="box-shadow: inset 0 0 200px rgba(0,0,0,0.5);"></div>
        
        <!-- Content -->
        <div id="content" class="absolute inset-0 flex items-center justify-center p-8 z-10"></div>
        
        <!-- Side Controls -->
        <div id="controls" class="fixed top-8 right-8 flex flex-col gap-3 z-50 opacity-20 hover:opacity-100 transition-opacity">
            <button onclick="togglePlay(event)" class="bg-black bg-opacity-30 backdrop-blur-sm p-3 rounded-full hover:bg-opacity-50 transition-all border border-white border-opacity-20">
                <svg id="playIcon" class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                </svg>
            </button>
            <button onclick="toggleMute(event)" class="bg-black bg-opacity-30 backdrop-blur-sm p-3 rounded-full hover:bg-opacity-50 transition-all border border-white border-opacity-20">
                <svg id="muteIcon" class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
        </div>
        
        <!-- Progress bar -->
        <div class="fixed bottom-0 left-0 right-0 h-1 bg-white bg-opacity-20 z-40">
            <div id="progress" class="h-full bg-white transition-all duration-300" style="width: 0%"></div>
        </div>
        
        <!-- Slide counter -->
        <div id="counter" class="fixed top-8 left-8 text-white text-lg font-bold opacity-50 z-40"></div>
    </div>

    <script>
        let currentSlide = 0;
        let isPlaying = true;
        let isMuted = false;
        const bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.3;

        const slides = [
            {
                type: 'developer',
                background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                content: {
                    lines: [
                        { text: '💻', size: 'text-8xl float-animation' },
                        { text: 'WEBSITE DEVELOPED BY', size: 'text-3xl tracking-widest' },
                        { text: 'ALI', size: 'text-8xl font-bold tracking-wider' }
                    ]
                }
            },
            {
                type: 'intro',
                background: 'linear-gradient(135deg, #8E2DE2 0%, #4A00E0 100%)',
                content: {
                    lines: [
                        { text: 'A THEATRICAL PRESENTATION', size: 'text-2xl tracking-wide' },
                        { text: 'HEALTH & TRADITIONAL MEDICINE', size: 'text-5xl font-bold' }
                    ]
                }
            },
            {
                type: 'chapter',
                background: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)',
                content: {
                    lines: [
                        { text: 'CHAPTER ONE', size: 'text-3xl tracking-widest' },
                        { text: 'THE CHARACTERS', size: 'text-6xl font-bold' }
                    ]
                }
            },
            {
                type: 'character',
                name: 'AYA',
                role: 'The Patient',
                description: 'A young woman suffering from severe pain, seeking treatment between traditional and modern medicine',
                background: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                avatar: 'A'
            },
            {
                type: 'character',
                name: 'NAJAT',
                role: 'Her Friend',
                description: 'A loyal and caring friend, trying to help Aya find the right treatment',
                background: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                avatar: 'N'
            },
            {
                type: 'character',
                name: 'SAAD',
                role: 'Her Brother',
                description: 'Aya\'s brother who cares deeply about her health and wants her to get proper medical care',
                background: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                avatar: 'S'
            },
            {
                type: 'character',
                name: 'SANAE',
                role: 'The Sorceress',
                description: 'A traditional healer who practices folk medicine and claims to cure with spiritual methods',
                background: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
                avatar: 'S'
            },
            {
                type: 'character',
                name: 'AYA',
                role: 'Sana\'s Helper',
                description: 'Assists the sorceress Sanae in her traditional healing practices (another person also named Aya)',
                background: 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)',
                avatar: 'A'
            },
            {
                type: 'character',
                name: 'SAFAA',
                role: 'The Nurse',
                description: 'Professional nurse at Dr. Basma\'s clinic, caring and attentive to patients',
                background: 'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
                avatar: 'S'
            },
            {
                type: 'character',
                name: 'DR. BASMA',
                role: 'The Doctor',
                description: 'A specialized doctor representing modern medicine, diagnosing cases with scientific accuracy',
                background: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
                avatar: 'B'
            },
            {
                type: 'chapter',
                background: 'linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%)',
                content: {
                    lines: [
                        { text: 'ACT I', size: 'text-4xl tracking-widest' },
                        { text: 'THE SORCERESS', size: 'text-5xl font-bold' }
                    ]
                }
            },
            {
                type: 'dialogue',
                scene: 'Scene 1',
                background: 'linear-gradient(135deg, #2c3e50 0%, #3498db 100%)',
                lines: [
                    { speaker: 'ALI', text: 'Welcome dear audience to our play which talks about health and traditional medicine. First of all, we introduce our players: Aya the patient; Najat her friend; Saad her brother; Sanae the sorceress; Safaa the nurse; Aya - Sana\'s helper; Basma the doctor.' }
                ]
            },
            {
                type: 'dialogue',
                background: 'linear-gradient(135deg, #434343 0%, #000000 100%)',
                lines: [
                    { speaker: 'NAJAT', text: 'What\'s wrong with you Aya you look worse today?' },
                    { speaker: 'AYA', text: 'I don\'t know Najat, I\'ve tried everything, the pain is getting worse.' }
                ]
            },
            {
                type: 'dialogue',
                background: 'linear-gradient(135deg, #868f96 0%, #596164 100%)',
                lines: [
                    { speaker: 'NAJAT', text: 'OK, don\'t worry, I know a sorceress everyone talks about, she\'s good.' },
                    { speaker: 'AYA', text: 'What do you want here?' }
                ]
            },
            {
                type: 'dialogue',
                background: 'linear-gradient(135deg, #3a1c71 0%, #d76d77 50%, #ffaf7b 100%)',
                lines: [
                    { speaker: 'NAJAT', text: 'We should see the sorceress.' },
                    { speaker: 'AYA', text: 'Wait here and don\'t leave your places.' }
                ]
            },
            {
                type: 'dialogue',
                background: 'linear-gradient(135deg, #134e5e 0%, #71b280 100%)',
                lines: [
                    { speaker: 'AYA (to Sanae)', text: 'There are two girls outside, would you like to let them in?' },
                    { speaker: 'SANAE', text: 'Ok, bring them in.' }
                ]
            },
            {
                type: 'dialogue',
                background: 'linear-gradient(135deg, #283048 0%, #859398 100%)',
                lines: [
                    { speaker: 'SANAE', text: 'Taslim... Taslim... Taslim... Taslim' },
                    { speaker: 'SANAE', text: 'Oh my God, it\'s an evil eye, ok we have solution; you must drink this every morning and don\'t tell me why?' }
                ]
            },
            {
                type: 'dialogue',
                background: 'linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%)',
                lines: [
                    { speaker: 'AYA', text: 'Ok, thank you so much.' },
                    { speaker: 'SANAE', text: 'Don\'t thank me, just get out quickly.' }
                ]
            },
            {
                type: 'dialogue',
                background: 'linear-gradient(135deg, #434343 0%, #3a3a3a 100%)',
                lines: [
                    { speaker: 'ALI', text: 'A week later Aya\'s situation still the same.' }
                ]
            },
            {
                type: 'chapter',
                background: 'linear-gradient(135deg, #200122 0%, #6f0000 100%)',
                content: {
                    lines: [
                        { text: 'ACT II', size: 'text-4xl tracking-widest' },
                        { text: 'THE DOCTOR', size: 'text-5xl font-bold' }
                    ]
                }
            },
            {
                type: 'dialogue',
                background: 'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)',
                lines: [
                    { speaker: 'SAAD', text: 'What is going on here? Aya you are getting worse; we need professional help, I will book you an appointment with Dr Basma.' },
                    { speaker: 'AYA', text: 'Ok, as you want.' }
                ]
            },
            {
                type: 'dialogue',
                background: 'linear-gradient(135deg, #360033 0%, #0b8793 100%)',
                lines: [
                    { speaker: 'SAFAA', text: 'Welcome, Aya please have a seat. Dr Basma will see you shortly.' }
                ]
            },
            {
                type: 'dialogue',
                background: 'linear-gradient(135deg, #614385 0%, #516395 100%)',
                lines: [
                    { speaker: 'DR. BASMA', text: 'Aya tell me exactly what you are feeling to find the cause and the cure.' },
                    { speaker: 'AYA', text: 'Lately, I\'ve been feeling dizzy and nothing stays in my stomach and I look pale.' }
                ]
            },
            {
                type: 'dialogue',
                background: 'linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)',
                lines: [
                    { speaker: 'DR. BASMA', text: 'Based on your symptoms, it appears that you have bacterial infection. Take this antibiotic for 15 days and you will recover, inshallah.' }
                ]
            },
            {
                type: 'dialogue',
                background: 'linear-gradient(135deg, #283048 0%, #859398 100%)',
                lines: [
                    { speaker: 'SAFAA', text: 'Excuse me, I must give you this injection before.' },
                    { speaker: 'AYA', text: 'Thank you Dr Basma, I feel better already just knowing what it is.' }
                ]
            },
            {
                type: 'thanks',
                background: 'linear-gradient(135deg, #2C5364 0%, #203A43 50%, #0F2027 100%)',
                content: {
                    lines: [
                        { text: '🎭', size: 'text-8xl' },
                        { text: 'SPECIAL THANKS', size: 'text-5xl font-bold tracking-wider' },
                        { text: 'To our amazing cast and production team', size: 'text-2xl' },
                        { text: 'AYA • NAJAT • SAAD • AYA • SANAE • SAFAA • BASMA', size: 'text-xl tracking-wide' },
                        { text: 'Thank you for bringing this story to life', size: 'text-2xl italic' }
                    ]
                }
            },
            {
                type: 'finale',
                background: 'linear-gradient(135deg, #000000 0%, #434343 100%)',
                content: {
                    lines: [
                        { text: 'THE END', size: 'text-6xl font-bold tracking-widest' },
                        { text: 'The play reminds us that in times of sickness', size: 'text-2xl' },
                        { text: 'we must trust in science and medicine.', size: 'text-2xl' },
                        { text: 'THANK YOU FOR WATCHING', size: 'text-4xl font-bold' }
                    ]
                }
            }
        ];

        function renderSlide() {
            const slide = slides[currentSlide];
            const app = document.getElementById('app');
            const content = document.getElementById('content');
            
            app.style.background = slide.background;
            
            document.getElementById('counter').textContent = `${currentSlide + 1} / ${slides.length}`;
            document.getElementById('progress').style.width = `${((currentSlide + 1) / slides.length) * 100}%`;
            
            let html = '';
            
            if (slide.type === 'intro' || slide.type === 'chapter' || slide.type === 'finale' || slide.type === 'developer' || slide.type === 'thanks') {
                html = '<div class="text-center space-y-8 w-full">';
                slide.content.lines.forEach(line => {
                    html += `<div class="${line.size} text-white" style="text-shadow: 0 4px 20px rgba(0,0,0,0.8)">${line.text}</div>`;
                });
                html += '</div>';
            }
            else if (slide.type === 'character') {
                html = `
                    <div class="text-center space-y-8 max-w-4xl w-full">
                        <div class="w-48 h-48 mx-auto rounded-full flex items-center justify-center text-white text-7xl font-bold shadow-2xl" style="background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);">
                            ${slide.avatar}
                        </div>
                        <div class="text-6xl font-bold text-white" style="text-shadow: 0 4px 20px rgba(0,0,0,0.5)">${slide.name}</div>
                        <div class="text-3xl text-white" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5)">${slide.role}</div>
                        <div class="text-xl text-white leading-relaxed px-8" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5)">${slide.description}</div>
                    </div>
                `;
            }
            else if (slide.type === 'dialogue') {
                html = '<div class="max-w-5xl w-full space-y-6">';
                if (slide.scene) {
                    html += `<div class="text-center mb-12"><div class="text-4xl font-bold text-white tracking-wider" style="text-shadow: 0 4px 20px rgba(0,0,0,0.8)">${slide.scene}</div></div>`;
                }
                slide.lines.forEach(line => {
                    html += `
                        <div class="bg-black bg-opacity-40 backdrop-blur-md rounded-xl p-8 border border-white border-opacity-20 shadow-2xl">
                            <div class="font-bold text-2xl text-white mb-4" style="text-shadow: 0 2px 10px rgba(0,0,0,0.8)">${line.speaker}</div>
                            <div class="text-xl text-white leading-relaxed" style="text-shadow: 0 2px 8px rgba(0,0,0,0.6)">${line.text}</div>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            content.innerHTML = html;
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        function handleClick(event) {
            // Start music on first interaction
            if (bgMusic.paused && !isMuted) {
                bgMusic.play().catch(e => console.log('Audio play failed:', e));
            }

            const rect = event.currentTarget.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const width = rect.width;
            
            if (x < width / 2) {
                prevSlide();
            } else {
                nextSlide();
            }
        }

        function togglePlay(event) {
            event.stopPropagation();
            isPlaying = !isPlaying;
            const icon = document.getElementById('playIcon');
            if (isPlaying) {
                icon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
                if (!isMuted) {
                    bgMusic.play().catch(e => console.log('Audio play failed:', e));
                }
            } else {
                icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
                bgMusic.pause();
            }
        }

        function toggleMute(event) {
            event.stopPropagation();
            isMuted = !isMuted;
            const icon = document.getElementById('muteIcon');
            
            bgMusic.muted = isMuted;
            
            if (isMuted) {
                icon.innerHTML = '<line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line><path d="M11 5L6 9H2v6h4l5 4V5z"></path>';
            } else {
                icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
                if (isPlaying) {
                    bgMusic.play().catch(e => console.log('Audio play failed:', e));
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                if (bgMusic.paused && !isMuted) {
                    bgMusic.play().catch(e => console.log('Audio play failed:', e));
                }
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            }
        });

        renderSlide();
    </script>
</body>
</html>
